<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open TV</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 700px at 20% -10%, #1d2a4a 0%, #0b0e17 60%); color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 4vh 5vw 0; }
  h1 { font-size: 28px; letter-spacing: .2em; margin: 0; font-weight: 800; opacity: .9; }
  #clock { font-size: 28px; font-variant-numeric: tabular-nums; opacity: .7; }
  main { padding: 5vh 5vw; }
  h2 { font-size: 18px; letter-spacing: .15em; opacity: .55; margin: 0 0 2vh; font-weight: 700; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
  a.tile { display: flex; flex-direction: column; justify-content: flex-end; height: 150px; padding: 18px 20px; border-radius: 18px;
    color: #fff; text-decoration: none; font-weight: 700; font-size: 24px; position: relative; overflow: hidden;
    background: var(--c); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  a.tile .mono { position: absolute; top: 10px; right: 16px; font-size: 64px; font-weight: 900; opacity: .22; line-height: 1; }
  footer { position: fixed; left: 0; right: 0; bottom: 3vh; text-align: center; font-size: 18px; opacity: .55; letter-spacing: .04em; }
  kbd { background: #263049; border-radius: 6px; padding: 2px 10px; margin: 0 2px; font: inherit; font-weight: 700; }
</style>
</head>
<body>
<header><h1>OPEN TV</h1><div id="clock"></div></header>
<main>
  <h2>APPS</h2>
  <div id="grid"></div>
</main>
<footer><kbd>▲</kbd><kbd>▼</kbd><kbd>◀</kbd><kbd>▶</kbd> move &nbsp;·&nbsp; <kbd>SELECT</kbd> open &nbsp;·&nbsp; hold <kbd>SELECT</kbd> for menu</footer>

<script>
  // Bundled demo injects DEFAULTS and OPEN_TV_DEMO; the real launcher fetches /api/services.
  var DEFAULTS = window.OPEN_TV_SERVICES || null;
  function render(list) {
    var g = document.getElementById('grid');
    list.forEach(function (s) {
      var a = document.createElement('a');
      a.className = 'tile'; a.href = s.url; a.style.setProperty('--c', s.color || '#2a3350');
      a.innerHTML = '<span class="mono">' + s.name.charAt(0) + '</span>' + s.name;
      if (window.OPEN_TV_DEMO) a.addEventListener('click', function (e) {
        e.preventDefault();
        if (window.__demoOpen) window.__demoOpen(s);
      });
      g.appendChild(a);
    });
    document.dispatchEvent(new Event('otv-rendered'));
  }
  if (DEFAULTS) render(DEFAULTS);
  else fetch('/api/services').then(function (r) { return r.json(); }).then(render);

  function tick() { var d = new Date(); document.getElementById('clock').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  tick(); setInterval(tick, 15000);
</script>
<!-- Real kiosk: the extension has already injected these. Standalone/dev: loaded from the server. -->
<script src="/nav-core.js"></script>
<script src="/shell.js"></script>
</body>
</html>
